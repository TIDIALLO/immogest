{% extends 'gestion/auth_base.html' %}
{% block title %}Mot de passe oublié — ImmoGest{% endblock %}
{% block content %}
  <p class="lead">Indiquez l'adresse email associée à votre compte : nous vous enverrons un lien pour choisir un nouveau mot de passe.</p>
  <form method="post">
    {% csrf_token %}
    <label>Adresse email</label>
    <input type="email" name="email" autofocus required>
    <button type="submit">Envoyer le lien</button>
  </form>
  <div class="back-link"><a href="{% url 'login' %}">← Retour à la connexion</a></div>
{% endblock %}
